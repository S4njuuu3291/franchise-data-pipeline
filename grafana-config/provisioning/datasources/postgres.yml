apiVersion: 1

datasources:
  - name: gx-metadata
    uid: gx-metadata
    type: postgres
    access: proxy

    url: gx-metadata-db:5432
    user: gx_metadata_user

    secureJsonData:
      password: $__env{GRAFANA_DB_PASSWORD}

    jsonData:
      database: gx_metadata
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false

      maxOpenConns: 5
      maxIdleConns: 2
      maxIdleConnsAuto: false
      connMaxLifetime: 300

    isDefault: true
    editable: false
